name: Fetch photos and screenshots (one-time)
on:
  push:
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p photos
          while read -r name url; do
            curl -fsSL -o "photos/$name.jpg" "$url?w=1920&h=1080&fit=crop&crop=entropy&q=80&fm=jpg"
          done <<'LIST'
          clear https://images.unsplash.com/photo-1682688479955-70964433648e
          partlycloudy https://images.unsplash.com/photo-1517758478390-c89333af4642
          mostlycloudy https://images.unsplash.com/photo-1621507068918-94b94e0f2650
          cloudy https://images.unsplash.com/photo-1769411972457-e89bb3350ac6
          overcast https://images.unsplash.com/photo-1591552265137-99c59d9f4927
          fog https://images.unsplash.com/photo-1491824989090-cc2d0b57eb0d
          hazy https://images.unsplash.com/photo-1601568585322-70bc574fd35a
          drizzle https://images.unsplash.com/photo-1643287146701-93c795880dda
          chancerain https://images.unsplash.com/photo-1513689559427-a303dfc617d2
          rain https://images.unsplash.com/photo-1610901342861-e472a8c248b5
          tstorms https://images.unsplash.com/photo-1594760467013-64ac2b80b7d3
          sleet https://images.unsplash.com/photo-1692362385851-cf68a6d9604b
          flurries https://images.unsplash.com/photo-1547754980-3df97fed72a8
          chancesnow https://images.unsplash.com/photo-1496765111150-918497b59c9e
          snow https://images.unsplash.com/photo-1675373420153-809b8d1da50c
          n_clear https://images.unsplash.com/photo-1488866022504-f2584929ca5f
          n_partlycloudy https://images.unsplash.com/photo-1654458471324-fccfed1e24aa
          n_mostlycloudy https://images.unsplash.com/photo-1514912885225-5c9ec8507d68
          n_cloudy https://images.unsplash.com/photo-1533983272060-edb6f56af634
          n_overcast https://images.unsplash.com/photo-1679212839469-fb16a48919ce
          n_fog https://images.unsplash.com/photo-1668166893230-bab2db9e4343
          n_hazy https://images.unsplash.com/photo-1513061379709-ef0cd1695189
          n_rain https://images.unsplash.com/photo-1752486345389-ed3b299f34af
          n_tstorms https://images.unsplash.com/photo-1511149755252-35875b273fd6
          n_sleet https://images.unsplash.com/photo-1470432581262-e7880e8fe79a
          n_flurries https://images.unsplash.com/photo-1734114650955-65c0d594b78b
          n_chancesnow https://images.unsplash.com/photo-1637765435803-af23755dbf88
          n_snow https://images.unsplash.com/photo-1731266150183-5055b7e31171
          LIST
          ls -la photos
          test "$(ls photos/*.jpg | wc -l)" = 28
      - name: Remove old files
        run: |
          git rm -r -q --ignore-unmatch images MMM-WeatherBackground.js MMM-WeatherBackground.css scr.png scr1.JPG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take screenshots on a real MagicMirror
        run: |
          git clone --depth 1 https://github.com/MagicMirrorOrg/MagicMirror "$RUNNER_TEMP/mm"
          cd "$RUNNER_TEMP/mm"
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          mkdir -p modules/MMM-WeatherBackgroundV4
          cp -r "$GITHUB_WORKSPACE"/MMM-WeatherBackgroundV4.* "$GITHUB_WORKSPACE"/photos modules/MMM-WeatherBackgroundV4/
          git clone --depth 1 https://github.com/cowboysdude/MMM-Cal modules/MMM-Cal
          cat > config/config.js <<'CFG'
          let config = {
            address: "localhost", port: 8080, ipWhitelist: [], language: "en", timeFormat: 12, units: "imperial",
            modules: [
              { module: "MMM-WeatherBackgroundV4", config: { opacity: 0.4 } },
              { module: "clock", position: "top_left" },
              { module: "MMM-Cal", header: "US Holidays and Birthdays", position: "top_left", config: { maxHolidays: 6 } },
              { module: "compliments", position: "lower_third" }
            ]
          };
          if (typeof module !== "undefined") { module.exports = config; }
          CFG
          (node --run server > /tmp/mm.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 2; done
          pip install -q playwright pillow
          python3 - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          from PIL import Image
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "examples")
          os.makedirs(out, exist_ok=True)
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome")
                  pg = await b.new_page(viewport={"width": 1920, "height": 1080})
                  await pg.goto("http://localhost:8080/")
                  await pg.wait_for_timeout(6000)
                  for name, icon, day in [("day-partlycloudy", "partlycloudy", True), ("night-clear", "clear", False), ("day-snow", "snow", True), ("night-tstorms", "tstorms", False)]:
                      await pg.evaluate("([i,d])=>{const s=MM.getModules().withClass('clock')[0]; MM.sendNotification('WEATHER',{icon:i,isDay:d,sunrise:null,sunset:null},s);}", [icon, day])
                      await pg.wait_for_timeout(5000)
                      f = os.path.join(out, name + ".png")
                      await pg.screenshot(path=f)
                      Image.open(f).convert("RGB").resize((1280, 720), Image.LANCZOS).save(f[:-4] + ".jpg", quality=82)
                      os.remove(f)
                  await b.close()
          asyncio.run(main())
          PY
          ls -la "$GITHUB_WORKSPACE/examples"
      - name: Commit
        run: |
          git config user.name "cowboysdude"
          git config user.email "cowboysdude@users.noreply.github.com"
          git add photos examples
          git commit -m "Add sharp 1920x1080 photos and new screenshots; remove old files"
          git push
